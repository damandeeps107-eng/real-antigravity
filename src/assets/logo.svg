<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5d77f"/>
      <stop offset="75%" stop-color="#b89128"/>
      <stop offset="100%" stop-color="#eec759"/>
    </linearGradient>

    <!-- Deep Royal Navy Background -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="100%" stop-color="#000a1c"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Shield / Medallion -->
  <circle cx="100" cy="100" r="94" fill="url(#navyBg)" stroke="url(#goldGradient)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- The Original Golden "D" Clinic Monogram (Mother & Baby) -->
  <g transform="translate(42, 28) scale(0.68)">
    <!-- Right curved bowl of the letter "D" -->
    <path d="M 90,15 
             C 145,15 195,55 195,120 
             C 195,185 145,225 90,225 
             C 70,225 55,218 50,210 
             C 58,202 75,206 90,206 
             C 130,206 172,172 172,120 
             C 172,68 130,34 90,34 
             C 75,34 58,38 50,30 
             C 55,22 70,15 90,15 Z" 
          fill="url(#goldGradient)"/>

    <!-- Mother Silhouette (Head) -->
    <circle cx="62" cy="65" r="17" fill="url(#goldGradient)"/>

    <!-- Mother flowing torso leaning gently over baby -->
    <path d="M 62,85 
             C 48,98 38,125 42,160 
             C 45,188 56,206 68,218 
             C 62,202 58,175 60,152 
             C 62,128 70,105 80,94 
             C 74,88 68,85 62,85 Z" 
          fill="url(#goldGradient)"/>

    <!-- Baby Silhouette (Head) -->
    <circle cx="95" cy="126" r="11" fill="url(#goldGradient)"/>

    <!-- Baby swaddle / body held in mother's embrace -->
    <path d="M 88,140 
             C 80,155 86,174 100,178 
             C 112,180 120,172 122,162 
             C 124,152 114,142 101,141 
             C 96,140 91,140 88,140 Z" 
          fill="url(#goldGradient)"/>

    <!-- Cradling hand sweep -->
    <path d="M 52,175 
             C 62,195 82,205 106,200 
             C 114,198 120,194 124,188 
             C 116,192 106,194 98,192 
             C 78,188 62,181 52,175 Z" 
          fill="url(#goldGradient)"/>
  </g>
</svg>
