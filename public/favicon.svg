<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#cca830"/>
      <stop offset="100%" stop-color="#9d7e1e"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="48" fill="#00142e" stroke="url(#favGold)" stroke-width="2.5"/>
  
  <!-- The Original Clinic "D" Monogram -->
  <g transform="translate(18, 12) scale(0.24)">
    <!-- Right curved bowl of the "D" -->
    <path d="M 120,40 C 180,40 250,90 250,175 C 250,260 180,310 120,310 C 95,310 80,300 75,290 C 85,280 105,285 125,285 C 165,285 218,245 218,175 C 218,105 165,65 125,65 C 105,65 85,70 75,60 C 80,50 95,40 120,40 Z" fill="url(#favGold)"/>
    <!-- Mother Head -->
    <circle cx="88" cy="98" r="22" fill="url(#favGold)"/>
    <!-- Mother posture -->
    <path d="M 88,124 C 70,140 58,175 62,220 C 65,255 78,280 92,295 C 85,275 80,240 82,210 C 84,180 95,150 108,135 C 102,128 94,124 88,124 Z" fill="url(#favGold)"/>
    <!-- Baby Head -->
    <circle cx="128" cy="180" r="14" fill="url(#favGold)"/>
    <!-- Baby body -->
    <path d="M 120,196 C 112,215 120,240 138,245 C 152,248 162,238 165,225 C 168,212 155,200 138,198 C 132,197 125,196 120,196 Z" fill="url(#favGold)"/>
  </g>
</svg>